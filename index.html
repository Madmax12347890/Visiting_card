<style>
/* =====================================================
   RESET
===================================================== */

.jd-card-page,
.jd-card-page *,
.jd-card-page *::before,
.jd-card-page *::after {
    box-sizing: border-box;
}


/* =====================================================
   MAIN PAGE
===================================================== */

.jd-card-page {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 0;
    background: #f1f2f4;
    font-family: Arial, Helvetica, sans-serif;
    color: #111;
    overflow: visible;
}


/* =====================================================
   RESPONSIVE BANNER
===================================================== */

.jd-banner {
    position: relative;
    width: 100%;
    height: auto;
    overflow: visible;
    line-height: 0;
}

.jd-banner img {
    display: block;
    width: 100%;
    height: auto;
    max-width: 100%;
    object-fit: contain;
}


/* =====================================================
   PROFILE PHOTO
===================================================== */

.jd-profile-photo {
    position: absolute;

    left: 50%;
    bottom: -52px;

    transform: translateX(-50%);

    width: 105px;
    height: 105px;

    border-radius: 50%;

    background: #ffffff;

    padding: 4px;

    box-shadow:
        0 2px 6px rgba(0, 0, 0, 0.35);

    z-index: 10;
}

.jd-profile-photo img {
    display: block;

    width: 100%;
    height: 100%;

    border-radius: 50%;

    object-fit: cover;
}


/* =====================================================
   PROFILE DETAILS
===================================================== */

.jd-profile-details {
    text-align: center;

    padding:
        63px
        20px
        8px;
}

.jd-profile-name {
    margin: 0;

    font-size: 21px;
    line-height: 1.3;

    font-weight: 700;
}

.jd-profile-tagline {
    margin-top: 4px;

    font-size: 13px;
    line-height: 1.4;

    color: #59677a;
}


/* =====================================================
   SAVE CONTACT
===================================================== */

.jd-save-contact {
    width: calc(100% - 40px);

    height: 52px;

    margin:
        0 auto
        20px;

    border: 1px solid #d5d5d5;

    border-radius: 28px;

    background: #ffffff;

    box-shadow:
        0 2px 3px rgba(0, 0, 0, 0.16);

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 10px;

    color: #111;

    font-size: 14px;

    font-weight: 600;

    cursor: pointer;

    outline: none;

    -webkit-tap-highlight-color: transparent;
}

.jd-save-contact svg {
    width: 15px;
    height: 15px;
}

.jd-save-contact:active {
    transform: scale(0.99);
}


/* =====================================================
   SOCIAL GRID
===================================================== */

.jd-social-grid {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 10px;

    padding:
        0
        20px
        14px;
}


/* =====================================================
   SOCIAL BUTTON
===================================================== */

.jd-social-button {
    height: 58px;

    background: #ffffff;

    border-radius: 5px;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-decoration: none;

    color: #333;

    -webkit-tap-highlight-color: transparent;
}

.jd-social-button svg {
    width: 20px;
    height: 20px;

    margin-bottom: 5px;
}

.jd-social-button span {
    font-size: 9px;

    color: #59677a;
}


/* =====================================================
   SOCIAL COLORS
===================================================== */

.jd-instagram {
    color: #e1306c;
}

.jd-facebook {
    color: #1877f2;
}

.jd-youtube {
    color: #ff0000;
}

.jd-linkedin {
    color: #0077b5;
}

.jd-website {
    color: #1728ff;
}

.jd-spotify {
    color: #1db954;
}

.jd-pinterest {
    color: #bd081c;
}

.jd-x {
    color: #000000;
}


/* =====================================================
   INFORMATION AREA
===================================================== */

.jd-information {
    padding:
        0
        20px
        10px;
}


/* =====================================================
   INFORMATION CARD
===================================================== */

.jd-info-card {
    width: 100%;

    min-height: 61px;

    margin-bottom: 10px;

    padding:
        9px
        14px;

    background: #ffffff;

    border-radius: 5px;

    display: flex;

    align-items: center;

    text-decoration: none;

    color: #111;
}


/* =====================================================
   INFORMATION ICON
===================================================== */

.jd-info-icon {
    width: 38px;
    height: 38px;

    min-width: 38px;

    margin-right: 12px;

    border-radius: 50%;

    background: #edf5ff;

    display: flex;

    align-items: center;
    justify-content: center;
}

.jd-info-icon svg {
    width: 20px;
    height: 20px;
}


/* =====================================================
   INFORMATION CONTENT
===================================================== */

.jd-info-content {
    min-width: 0;
}

.jd-info-label {
    margin-bottom: 2px;

    font-size: 11px;

    color: #59677a;
}

.jd-info-value {
    font-size: 13px;

    line-height: 1.35;

    font-weight: 500;

    color: #111;

    word-break: break-word;
}


/* =====================================================
   ICON COLORS
===================================================== */

.jd-email-icon {
    color: #ff0000;
}

.jd-location-icon {
    color: #e60000;
}

.jd-phone-icon {
    color: #69717a;
}

.jd-whatsapp-icon {
    color: #00c853;
    background: #eafff1;
}

===================================================== */

<script>

function jdSaveContact() {

    const vCardData =
`BEGIN:VCARD
VERSION:3.0
FN:Manu Markande
N:Markande;Manu;;;
ORG:Social Scale Co.
EMAIL;TYPE=INTERNET:manumarkande80@gmail.com
TEL;TYPE=CELL:+918766296089
TEL;TYPE=CELL:+919310807894
TEL;TYPE=WORK:+919711490717
ADR;TYPE=HOME:;;222 Kailash Hills;New Delhi;;110065;India
END:VCARD`;

    const blob = new Blob(
        [vCardData],
        {
            type: "text/vcard;charset=utf-8"
        }
    );

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");

    link.href = url;

    link.download = "Manu-Markande.vcf";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    setTimeout(function() {
        URL.revokeObjectURL(url);
    }, 1000);

}

</script>
